# S7785 (top-level await i.p.v. een Promise chain) negeren: de scripts gebruiken bewust Promise chains
# met process.exitCode bij een fout (zie AGENTS.md).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S7785
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

# Coverage van de Vitest-tests (pnpm run test, in de stage Codekwaliteit)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Geen productiecode, of bewust niet getest (deploy met credentials): telt niet mee voor de coverage.
# scanMaven geeft sonar.coverage.exclusions enkel mee als coverageExclusions gezet is, dus dit geldt.
sonar.coverage.exclusions=test/**,**/*.config.js,src/99_deploy_latest.js
