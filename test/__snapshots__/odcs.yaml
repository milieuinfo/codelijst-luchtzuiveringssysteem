version: <versie>
status: draft
domain: luchtzuiveringssystemen
dataProduct: codelijst-luchtzuiveringssysteem
description:
  purpose: >-
    Deze dataset bevat codelijsten i.v.m. luchtzuiveringssystemen voor stallen, gericht op de reductie van
    stikstofuitstoot. De codelijsten hebben een onderlinge samenhang, bv. types van luchtzuiveringssystemen met
    specifieke regels. De lijsten worden gebruikt bij een IOT-opzet, i.e. sensordata die aangeleverd worden voor de
    monitoring van deze systemen. Deze monitoring is opgezet in het kader van het ARMOS-project.
  usage: Codelijsten ivm. luchtzuiveringssystemen voor stallen, geserialiseerd als parquet bestand.
  limitations: >-
    Deze combinatie van codelijsten kwam tot stand in het kader van het ARMOS-project en is een representatie van de
    logica en typering, die vervat is in regelgeving rond reductie van ammoniakemissie van stallen.
